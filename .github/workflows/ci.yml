# Publishes the website. Its source is website/ of nuclearlang/lang; GitHub serves nuclearlang.github.io only from
# this repository, so this workflow checks that one out, builds the site there and deploys the bundle.
# It runs by hand (Actions → Run workflow, or `gh workflow run ci -R nuclearlang/nuclearlang.github.io`), every day,
# and on a `repository_dispatch` of type `website` (sent by the tree's CI once it has a token for it).
name: ci

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  repository_dispatch:
    types: [website]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: nuclearlang/lang
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # The mobile onboarding is replayed (`nuclear new -p mobile` needs Flutter): the version of the tree's CI.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
      - name: Install nuclear
        run: |
          installer/release/build-runtimes.sh && installer/install.sh --no-vscode --no-zed --no-agent
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: "Content, build, tests, bundle"
        working-directory: website
        run: |
          (cd tools && npm ci --no-audit --no-fund)
          node tools/content.mjs
          nuclear build
          nuclear install
          nuclear test
          (cd build/app && npx vite build)
      - name: The SPA fallback (an unknown address loads the app)
        working-directory: website
        run: cp build/app/dist/index.html build/app/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
